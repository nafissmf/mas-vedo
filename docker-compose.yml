services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: kuesioner_tesis
      DB_USER: kuesioner
      DB_PASSWORD: kuesioner_rahasia
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    container_name: mysql-container
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kuesioner_tesis
      MYSQL_USER: kuesioner
      MYSQL_PASSWORD: kuesioner_rahasia
      MYSQL_ROOT_PASSWORD: ganti_root_password_ini
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pganti_root_password_ini"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
