# Reverse proxy untuk aplikasi kuesioner (nginx berjalan sebagai container).
# Container nginx harus berada di network app-bridge.
# Ganti kuesioner.example.com dengan domain asli.

server {
    listen 80;
    listen [::]:80;
    server_name kuesioner.example.com;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS internal Docker. Dengan variabel, nginx tetap bisa start walau app sedang mati,
    # dan IP baru terbaca setelah container app dibuat ulang.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kuesioner_app http://kuesioner-app:3000;

    location / {
        proxy_pass $kuesioner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
